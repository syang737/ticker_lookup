<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ticker Lookup · Sign in</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #fff; --text: #1b1f24; --muted: #5b6470;
    --border: #d9dde3; --accent: #2457d6; --accent-text: #fff; --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111418; --card: #1a1f25; --text: #e6e9ed; --muted: #9aa4b1;
      --border: #2d343c; --accent: #5b8cff; --accent-text: #0b0e12; --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
    background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  form {
    width: 100%; max-width: 340px; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; padding: 28px;
  }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  input, button { width: 100%; font: inherit; border-radius: 8px; padding: 10px 12px; }
  input { border: 1px solid var(--border); background: var(--bg); color: var(--text); }
  input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  button {
    margin-top: 12px; border: 0; background: var(--accent); color: var(--accent-text);
    font-weight: 600; cursor: pointer;
  }
  .error { color: var(--error); font-size: 14px; margin: 10px 0 0; display: none; }
  .show { display: block; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Ticker Lookup</h1>
  <p>Enter the team password.</p>
  <input type="password" name="password" autocomplete="current-password" autofocus required aria-label="Password">
  <div class="error" id="error" role="alert">Wrong password.</div>
  <button type="submit">Sign in</button>
</form>
<script>
  if (new URLSearchParams(location.search).has("error")) {
    document.getElementById("error").classList.add("show");
  }
</script>
</body>
</html>
